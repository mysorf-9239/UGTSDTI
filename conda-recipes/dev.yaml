name: ugtsdti
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core scientific stack (same as base)
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - tqdm>=4.65
  - pyyaml>=6.0

  # Dev tools via conda
  - pytest>=7.4
  - pytest-cov>=4.1

  # Pip-only packages
  - pip:
      - torch>=2.0.0
      - torch_geometric>=2.3
      - transformers>=4.30
      - rdkit>=2023.3
      - loguru>=0.7
      - hypothesis>=6.80
      - ruff>=0.1.6
      - mypy>=1.5
      - pre-commit>=3.4
      - -e "..[dev]"
