name: ugtsdti
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core scientific stack
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - tqdm>=4.65

  # PyYAML for config system
  - pyyaml>=6.0

  # Pip-only packages
  - pip:
    - torch>=2.0.0
    - torch_geometric>=2.3
    - transformers>=4.30
    - rdkit>=2023.3
    - loguru>=0.7
    - -e .
