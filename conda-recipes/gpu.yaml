name: ugtsdti-gpu
channels:
  - pytorch
  - nvidia
  - pyg
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # CUDA toolkit
  - pytorch-cuda=11.8

  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - tqdm>=4.65
  - pyyaml>=6.0

  - pip:
    # Pinned CUDA-compatible torch
    - torch==2.1.0+cu118
    - torch_geometric>=2.3
    - transformers>=4.30
    - rdkit>=2023.3
    - loguru>=0.7
    - -e .
