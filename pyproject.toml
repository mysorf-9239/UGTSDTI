[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugtsdti"
version = "0.1.0"
description = "Uncertainty-Gated Teacher-Student for DTI Prediction"
authors = [
    { name = "mysorf" }
]
dependencies = [
    "torch>=2.0.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "loguru",
    "hydra-core>=1.3.0",
    "wandb",
    "PyTDC",
    "transformers",
    "hydra-optuna-sweeper"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ugtsdti*"]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
ignore_missing_imports = true
strict_optional = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
