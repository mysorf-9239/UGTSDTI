[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugtsdti"
version = "0.1.0"
description = "Uncertainty-Gated Teacher-Student for DTI Prediction"
authors = [
    { name = "mysorf" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "transformers>=4.30",
    "torch_geometric>=2.3",
    "rdkit>=2023.3",
    "loguru>=0.7",
]

[project.optional-dependencies]
# Data acquisition — only needed for one-time dataset download, not runtime
acquisition = [
    "PyTDC>=0.4.1",
]
# Logging backend — optional plugin
wandb = [
    "wandb>=0.15",
]
# Development tools
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.80",
    "ruff>=0.1.6",
    "mypy>=1.5",
    "pre-commit>=3.4",
]

[project.scripts]
ugtsdti = "ugtsdti.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ugtsdti*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
exclude = ["rdkit-stubs", "examples", "scripts", "data/"]

[tool.pytest.ini_options]
testpaths = [
    "tests/",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ugtsdti"]
omit = ["tests/*", "data/*", "artifacts/*"]
