version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

# Build documentation in the docs/ directory with mkdocs/sphinx (placeholder)
mkdocs:
  configuration: docs/mkdocs.yml
  fail_on_warning: false

python:
  install:
    - requirements: requirements.txt
    - method: pip
      path: .
