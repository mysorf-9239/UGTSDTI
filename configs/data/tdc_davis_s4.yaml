train:
  name: "tdc_caching_dataset"
  params:
    name: "DAVIS"
    split: "train"
    split_type: "cold_split"
    column_name: ["Drug", "Target"]
    frac: [0.8, 0.1, 0.1]
    seed: 42
    binarize_labels: true
    affinity_threshold: 7.0
    scenario_name: "s4"

