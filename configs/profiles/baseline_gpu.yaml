extends:
  - ../baseline_reference.yaml
experiment:
  name: baseline-gpu
data:
  dataset: davis
  preprocessing_version: v1
  split_version: v1
scenario:
  train: s1
  eval:
    - s1
    - s2
    - s3
    - s4
training:
  loop:
    epochs: 10
    checkpoint_every_epochs: 1
    summary_every_steps: 10
    eval_every_epochs: 1
    eval_partition: test
    max_grad_norm: 5.0
    fail_on_nonfinite_loss: true
    fail_on_nonfinite_grad: true
    select_checkpoint: best
    best_metric: metrics.auroc
    best_mode: max
    early_stopping:
      enabled: true
      patience: 3
      min_delta: 0.0
logging:
  backend: file
  trace_execution: false
  inspect_state: false
runtime:
  device: cuda
  seed: 7
  deterministic: false
  precision: mixed
  num_workers: 4
  pin_memory: true
  batch_size: 64
  data_dir: data
  artifacts_dir: artifacts/baseline/gpu
  checkpoint_dir: artifacts/baseline/gpu/checkpoints
