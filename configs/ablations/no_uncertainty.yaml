extends:
  - ../base_full.yaml
interaction:
  uncertainty:
    type: uncertainty.confidence_proxy
    inputs:
      - teacher.logits
      - student.logits
    params:
      enabled: true
      targets:
        teacher: false
        student: false
decision:
  type: gate.basic
  strategy: soft
  use_uncertainty: false
  fallback:
    no_teacher: student
    no_student: teacher
